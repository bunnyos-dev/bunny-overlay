name: Check

# Installs each package in a fresh Gentoo container, the way a user would:
# the overlay added as a repository, then emerge. Runs on every change and
# once a week, so a change in Gentoo that breaks an ebuild shows up here.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 9 * * 2"
  workflow_dispatch:

jobs:
  overrides:
    name: OVERRIDES.md up to date
    runs-on: ubuntu-latest
    container:
      image: gentoo/stage3:latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: overlay
      - name: Get the Gentoo tree
        run: emerge-webrsync -q
      - name: Check every package that replaces Gentoo's has a reason
        run: overlay/tools/check-overrides.sh overlay /var/db/repos/gentoo

  install:
    name: emerge ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [app-admin/bunny-bin, app-admin/bunny, sys-apps/bunny-release]
    container:
      image: gentoo/stage3:latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: overlay
      - name: Get the Gentoo tree
        run: emerge-webrsync -q
      - name: Add this overlay
        run: |
          mkdir -p /var/db/repos /etc/portage/repos.conf /etc/portage/package.accept_keywords
          cp -r overlay /var/db/repos/bunny
          printf '[bunny]\nlocation = /var/db/repos/bunny\n' > /etc/portage/repos.conf/bunny.conf
          # Live ebuilds aren't keyworded; accept this one for the test.
          printf 'app-admin/bunny **\n' > /etc/portage/package.accept_keywords/bunny
      - name: Use Gentoo's prebuilt packages where there are some
        run: |
          printf 'FEATURES="getbinpkg -ipc-sandbox -network-sandbox -pid-sandbox"\n' >> /etc/portage/make.conf
          getuto
      - name: Install
        run: emerge --quiet-build --oneshot "${{ matrix.package }}"
      - name: Run it
        if: startsWith(matrix.package, 'app-admin/bunny')
        run: |
          bunny --version
          bunny check --help >/dev/null
      - name: Check the system says Bunny Linux
        if: matrix.package == 'sys-apps/bunny-release'
        run: |
          set -x
          [ "$(readlink /etc/os-release)" = ../usr/lib/bunny-release/os-release ]
          . /etc/os-release
          [ "$ID" = bunny ] && [ "$ID_LIKE" = gentoo ] && [ "$NAME" = "Bunny Linux" ]
          grep -Eq "^NAME=['\"]?Gentoo" /usr/lib/os-release
          grep -q PLACEHOLDER /usr/share/bunny-release/logo.txt
          [ -f /etc/xdg/fastfetch/config.jsonc ]
          # Removing it gives Gentoo's link back.
          emerge --quiet --unmerge sys-apps/bunny-release
          [ "$(readlink /etc/os-release)" = ../usr/lib/os-release ]
